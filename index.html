function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
const STK=STU.map(s=>norm(s.name.replace(',',' ')).split(' '));
function findStu(name){const t=norm(name).split(' ');let best=-1,bs=0;
 STK.forEach((r,i)=>{const used=new Set();let m=0;for(const w of t){let bj=-1;r.forEach((x,j)=>{if(used.has(j))return;if(x===w||(w.length>3&&lev(x,w)<=1))bj=bj<0||x===w?j:bj});if(bj>=0){used.add(bj);m++}}
  const sc=m/Math.max(t.length,r.length);if(sc>bs){bs=sc;best=i}});
 return bs>=0.75?best:-1}
function findComp(comp,area){const t=norm(comp);let hits=[];
 AREAS.forEach((a,ai)=>a.comps.forEach(c=>{const n=norm(c[1]);if(n===t||n.includes(t)||t.includes(n))hits.push([ai,c[0]])}));
 if(hits.length>1&&area){const na=norm(area);const h2=hits.filter(h=>{const an=norm(AREAS[h[0]].name);return an.includes(na)||na.includes(an)});if(h2.length)hits=h2}
 return hits[0]||null}
async function readPdf(file){const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const lines=[];
 for(let p=1;p<=pdf.numPages;p++){const tc=await(await pdf.getPage(p)).getTextContent();
  const it=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5]})).sort((a,b)=>b.y-a.y||a.x-b.x);
  let row=[],ly=null;for(const i of it){if(ly!==null&&Math.abs(i.y-ly)>3){lines.push(row.sort((a,b)=>a.x-b.x).map(r=>r.s).join(' '));row=[]}row.push(i);ly=i.y}
  if(row.length)lines.push(row.sort((a,b)=>a.x-b.x).map(r=>r.s).join(' '))}
 return lines.map(l=>l.replace(/\s+/g,' ').trim())}
function parse(lines){const o={recs:[]};let cr=null;const H=/^(.+?)(?: \[Fila [AB]\])? — Nivel (AD|A|B|C) \((\d+)\/\d+, (\d+)%\)$/;
 for(const l of lines){let m;
  if(m=l.match(/^Competencia:\s*(.+)$/))o.comp=m[1];else if(m=l.match(/^Tema de la clase:\s*(.+)$/))o.tema=m[1];else if(/^Evaluación de recuperación/.test(l))o.rec=true;
  else if(m=l.match(/^Área:\s*(.+)$/))o.area=m[1];
  else if(m=l.match(/^Fecha de evaluación[^:]*:\s*(?:[^,]+,\s*)?(.+)$/))o.fecha=m[1];
  else if(m=l.match(H)){cr={name:m[1],nl:m[2],pct:+m[4],t:[]};o.recs.push(cr)}
  else if(/^(FILA [AB] —|Estudiantes ausentes|Prof\.)/.test(l))cr=null;
  else if(cr)cr.t.push(l)}
 o.recs.forEach(r=>{const sn=r.t.join(' ').split(/(?<=[.!?])\s+/).filter(s=>s&&!/obtuvo el nivel|Respondió correctamente|acertó la pregunta adicional/.test(s));
  let t=sn.join(' ').replace(/\$\{NB\}/g,'').trim();r.txt=t.length>=10?t.slice(0,500):DEF[r.nl]});return o}
function apply(o,fn){const L=[];const tgt=findComp(o.comp||'',o.area);
 if(!tgt||!o.recs.length){L.push(`<p class="er">✖ ${fn}: no se reconoció la competencia${o.comp?' “'+o.comp+'”':''} o no hay resultados.</p>`);return L}
 const [ai,cc]=tgt,sh=AREAS[ai].sheet;let up=0,same=0,nf=[];S[sh]=S[sh]||{};
 for(const r of o.recs){const si=findStu(r.name);if(si<0){nf.push(r.name);continue}
  const id=String(STU[si].id);S[sh][id]=S[sh][id]||{};const c=S[sh][id][cc];
  if(!c||RANK[r.nl]>RANK[c.nl]||(RANK[r.nl]===RANK[c.nl]&&r.pct>(c.pct||0))){const ch=!c||c.nl!==r.nl;S[sh][id][cc]={nl:r.nl,pct:r.pct,date:o.fecha||'',txt:r.txt};if(ch)up++;else same++}else same++}
 save();cur=ai;addLog(o,sh,cc);if(up)bump();
 L.push(`<p class="ok">✔ ${fn} → ${AREAS[ai].name} · ${cc} ${AREAS[ai].comps.find(c=>c[0]===cc)[1]} (${o.fecha||''}): ${up} actualizados, ${same} sin cambio.</p>`);
 if(nf.length)L.push(`<p class="wr">⚠ No encontrados en la lista: ${nf.join('; ')}</p>`);return L}

 '<table class="nb sg"><tr><td><img src="'+IMG.firma+'" height="55"><div class="ln"></div>Prof. Walter Rodrigo Arribasplata Chavarry<br>Docente de aula 5.° “E”</td><td><div style="height:55px"></div><div class="ln"></div>Director(a)</td><td><div style="height:55px"></div><div class="ln"></div>Padre, madre o apoderado</td></tr></table>'+
 '<p class="ft">Cajamarca, '+fecha+'. Documento auxiliar generado a partir del registro del docente (formato referencial según RVM N.° 094-2020-MINEDU, Informe de progreso de las competencias). No sustituye los documentos oficiales emitidos por el SIAGIE.</p></div>'}

const TRANS=new Set(['0006-DESEN TIC','0007-GEST AUTO']);
const SITL={PRO:'PROMOVIDO',PER:'PERMANECE EN EL GRADO',RR:'REQUIERE RECUPERACIÓN PEDAGÓGICA','':'Pendiente de confirmación del docente'};
const ORD=()=>AREAS.map((a,i)=>i).sort((x,y)=>(TRANS.has(AREAS[x].sheet)?1:0)-(TRANS.has(AREAS[y].sheet)?1:0)||x-y);
function refStatus(s){let miss=0,tot=0,cAreas=0,areasOk=0,nonCnotB=false,cN=0,nA=0;const fa=[];
 AREAS.forEach(a=>{if(TRANS.has(a.sheet)||(META.na&&META.na[a.sheet]))return;const d=(S[a.sheet]||{})[s.id]||{};const n=a.comps.length;let okc=0,cc=0,mm=0;
  a.comps.forEach(c=>{tot++;const r=d[c[0]];if(!r){miss++;mm++;return}if(r.nl==='C'){cc++;cN++}else{okc++;if(r.nl!=='B')nonCnotB=true}});
  if(mm)fa.push(a.name);nA++;if(okc>=Math.ceil(n/2))areasOk++;if(cc>n/2)cAreas++});
 let st='INC';if(!miss)st=areasOk===nA?'PRO':(cAreas>=4&&!nonCnotB?'PER':'RR');
 return{st,miss,tot,areasOk,nA,cAreas,cN,fa}}
function refTxt(r){if(r.st==='INC')return 'Datos incompletos: faltan '+r.miss+' de '+r.tot+' competencias. Áreas con faltantes: '+r.fa.join(', ')+'.';
 return {PRO:'Cumpliría la condición de promoción',PER:'Cumpliría la condición de permanencia',RR:'No cumple promoción ni permanencia: requeriría recuperación'}[r.st]+' ('+r.areasOk+' de '+r.nA+' áreas con B o más en la mitad o más de sus competencias).'}
function sitHtml(s){const v=(META.sit||{})[s.id]||'';return '<table><tr><th style="width:150px">Situación final</th><td><b>'+SITL[v]+'</b><br><span style="font-size:9px;color:#444">Se define al cierre del período lectivo con el último nivel de logro de cada competencia y se oficializa en el Acta Oficial de Evaluación del SIAGIE (RVM N.° 094-2020-MINEDU y RVM N.° 048-2024-MINEDU).</span></td></tr></table>'}
function situacionHtml(){const c={PRO:0,PER:0,RR:0,'':0};STU.forEach(s=>c[(META.sit||{})[s.id]||'']++);
 return '<p><b>Situación final de los estudiantes (RVM N.° 094-2020-MINEDU, ciclo V, 5.° grado)</b></p><p style="text-align:justify">La situación final se define al cierre del período lectivo con el último nivel de logro de cada competencia (RVM N.° 048-2024-MINEDU); las competencias transversales no se toman en cuenta. Confirmada por el docente: promovidos '+c.PRO+', permanecen en el grado '+c.PER+', requieren recuperación '+c.RR+', pendientes de confirmación '+c[''] +'.</p>'}
function renderSit(){let h='<p style="color:var(--mut);font-size:12px;margin:0 0 10px">Verificación referencial para 5.° grado de primaria (ciclo V), RVM N.° 094-2020-MINEDU: <b>promovido</b> si alcanza B o más en la mitad o más de las competencias de todas las áreas; <b>permanece</b> si tiene C en más de la mitad de las competencias de cuatro áreas y B en las demás; en otro caso <b>requiere recuperación</b>. La decisión final es del docente: confírmala con el selector. No se tienen en cuenta las competencias transversales. Se evalúa con el último nivel de logro de cada competencia.</p>';
 STU.forEach(s=>{const r=refStatus(s),v=(META.sit||{})[s.id]||'';h+='<div class="dcat"><b>'+esc(pn(s.name))+'</b><div class="gd">'+refTxt(r)+'</div><select data-sid="'+attr(s.id)+'">'+[['','Pendiente de confirmación'],['PRO','Promovido'],['PER','Permanece en el grado'],['RR','Requiere recuperación']].map(o=>'<option value="'+o[0]+'"'+(o[0]===v?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div>'});
 $('sbody').innerHTML=h}
$('sb').onclick=()=>{renderSit();$('sw').style.display='block';$('sw').scrollTop=0};$('scl').onclick=()=>{$('sw').style.display='none'};
$('sbody').onchange=e=>{const t=e.target;if(!t.dataset||!t.dataset.sid)return;META.sit=META.sit||{};if(t.value)META.sit[t.dataset.sid]=t.value;else delete META.sit[t.dataset.sid];saveMeta();bump()};

if('serviceWorker' in navigator){
 const had=!!navigator.serviceWorker.controller;let rl=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});
 window.addEventListener('load',async()=>{try{
  const rs=await navigator.serviceWorker.getRegistrations();
  for(const r of rs){const u=(r.active||r.waiting||r.installing||{}).scriptURL||'';if(u&&!/\/sw\.js(\?|$)/.test(u))await r.unregister()}
  const reg=await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});reg.update();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update()});
 }catch(e){}});
}
